    name: "Vindication"
    icon: "spell_holy_vindication"
    row: 3
    column: 1
    maxRanks: 3
    castTime: "Passive"
    descriptions:
      - "Gives your damaging melee attacks a chance to reduce the target's Attack Power by 42, and increase your Attack Power by 1% for 30 sec."
      - "Gives your damaging melee attacks a chance to reduce the target's Attack Power by 84, and increase your Attack Power by 2% for 30 sec."
      - "Gives your damaging melee attacks a chance to reduce the target's Attack Power by 126, and increase your Attack Power by 3% for 30 sec."
  - id: "sanctified-judgement"
    name: "Sanctified Judgement"
    icon: "spell_holy_righteousfury"
    row: 3
    column: 2
    maxRanks: 3
    castTime: "Passive"
    descriptions:
      - "Gives your Judgement ability a 33% chance to return 20% of the Mana cost of the judged seal."
      - "Gives your Judgement ability a 66% chance to return 20% of the Mana cost of the judged seal."
      - "Gives your Judgement ability a 100% chance to return 20% of the Mana cost of the judged seal."
  - id: "seal-of-command"
    name: "Seal of Command"
    icon: "ability_warrior_innerrage"
    row: 3
    column: 3
    maxRanks: 1
    cost: "65 Mana"
    castTime: "Instant"
    descriptions:
      - "Gives the Paladin a chance to deal additional Holy damage equal to 70% of normal weapon damage. Only one Seal can be active on the Paladin at any one time. Lasts 30 sec.\n\nUnleashing this Seal's energy will judge an enemy, instantly causing 68 to 73 Holy damage, 137 to 146 if the target is stunned or incapacitated."
  - id: "pursuit-of-justice"
    name: "Pursuit of Justice"
    icon: "spell_holy_persuitofjustice"
    row: 3
    column: 4
    maxRanks: 2
    castTime: "Passive"
    descriptions:
      - "Increases movement speed and mounted movement speed by 8%. This does not stack with other movement speed increasing effects."
      - "Increases movement speed and mounted movement speed by 16%. This does not stack with other movement speed increasing effects."
  - id: "eye-for-an-eye"
    name: "Eye for an Eye"
    icon: "spell_holy_eyeforaneye"
    row: 4
    column: 1
    maxRanks: 2
    castTime: "Passive"
    descriptions:
      - "All critical strikes against you cause 5% of the damage taken to the attacker as well. The damage caused by Eye for an Eye will not exceed 50% of the Paladin's total health."
      - "All critical strikes against you cause 10% of the damage taken to the attacker as well. The damage caused by Eye for an Eye will not exceed 50% of the Paladin's total health."
  - id: "sacred-arbiter"
    name: "Sacred Arbiter"
    icon: "spell_holy_righteousfury"
    row: 4
    column: 3
    maxRanks: 1
    castTime: "Passive"
    descriptions:
      - "Increases the damage of your Holy Strike ability by 10% and causes it to refresh all Judgement effects on the target."
  - id: "crusade"
    name: "Crusade"
    icon: "spell_holy_crusade"
    row: 4
    column: 4
    maxRanks: 2
    castTime: "Passive"
    descriptions:
      - "Increases all damage dealt by 1%. Increased by an additional 1% against Demon and Undead targets."
      - "Increases all damage dealt by 2%. Increased by an additional 2% against Demon and Undead targets."
  - id: "two-handed-weapon-specialization"
    name: "Two-Handed Weapon Specialization"
    icon: "inv_hammer_04"
    row: 5
    column: 1
    maxRanks: 3
    castTime: "Passive"
    descriptions:
      - "Increases the damage you deal with two-handed melee weapons by 3%."
      - "Increases the damage you deal with two-handed melee weapons by 6%."
      - "Increases the damage you deal with two-handed melee weapons by 9%."
  - id: "vengeance"
    name: "Vengeance"
    icon: "ability_racial_avatar"
    row: 5
    column: 2
    maxRanks: 3
    castTime: "Passive"
    requires:
      talentId: "sanctified-judgement"
      ranks: 3
    descriptions:
      - "Increases your Physical and Holy damage dealt by 1% for 30 sec after landing a critical strike. Stacks up to 5 times."
      - "Increases your Physical and Holy damage dealt by 2% for 30 sec after landing a critical strike. Stacks up to 5 times."
      - "Increases your Physical and Holy damage dealt by 3% for 30 sec after landing a critical strike. Stacks up to 5 times."
  - id: "repentance"
    name: "Repentance"
    icon: "spell_holy_prayerofhealing"
    row: 5
    column: 3
    maxRanks: 1
    cost: "60 Mana"
    range: "20 yd range"
    castTime: "Instant"
    cooldown: "1 min cooldown"
    descriptions:
      - "Puts the enemy target in a state of meditation, incapacitating them for up to 6 sec.  Any damage caused will awaken the target.  Only works against Humanoids."
  - id: "champion-of-the-light"
    name: "Champion of the Light"
    icon: "spell_holy_championsbond"
    row: 6
    column: 2
    maxRanks: 3
    castTime: "Passive"
    descriptions:
      - "Increases your spell damage and healing by up to 33% of your Intellect."
      - "Increases your spell damage and healing by up to 66% of your Intellect."
      - "Increases your spell damage and healing by up to 100% of your Intellect."
  - id: "instrument-of-law"
    name: "Instrument of Law"
    icon: "ability_paladin_hammeroftherighteous"
    row: 6
    column: 3
    maxRanks: 2
    castTime: "Passive"
    descriptions:
      - "Reduces the cast time of your Hammer of Wrath by 0.5 sec, and reduces all threat you generate by 10% while Righteous Fury is not active."
      - "Reduces the cast time of your Hammer of Wrath by 1 sec, and reduces all threat you generate by 20% while Righteous Fury is not active."
  - id: "twist-of-light"
    name: "Twist of Light"
    icon: "spell_holy_divineintervention"
    row: 7
    column: 2
    maxRanks: 1
    castTime: "Passive"
    required: "Requires Level 40"
    descriptions:
      - "When you replace your Seal of Command, Seal of Righteousness, Seal of Fury, or Seal of Justice with a different Seal, gain an Echo. Your next melee attack applies the replaced Seal's effects, consuming the Echo."
