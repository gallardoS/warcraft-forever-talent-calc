    maxRanks: 2
    castTime: "Passive"
    descriptions:
      - "You heal your pet for 8% of all spell damage you deal. When you gain Mana from Life Tap, your summoned demon gains 50% of the Mana you gain."
      - "You heal your pet for 8% of all spell damage you deal. When you gain Mana from Life Tap, your summoned demon gains 100% of the Mana you gain."
